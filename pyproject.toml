[project]
name = "prime-agent-zulip"
version = "0.1.0"
description = "Zulip bridge for Prime Agent: persistent chat with full message interactivity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "zulip>=0.9",
]

[project.scripts]
prime-zulip = "prime_zulip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_zulip"]
